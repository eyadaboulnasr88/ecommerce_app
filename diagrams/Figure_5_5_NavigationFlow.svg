<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" font-family="Arial, sans-serif">
  <style>
    .title { font-size: 18px; font-weight: bold; fill: #1F3864; }
    .screen-label { font-size: 13px; font-weight: 700; fill: #1F3864; }
    .route { font-size: 10px; fill: #475569; font-family: 'Consolas','Courier New',monospace; }
    .edge-label { font-size: 11px; fill: #1F3864; font-style: italic; }
    .screen { fill: #EAF1FB; stroke: #1F3864; stroke-width: 1.5; rx: 10; }
    .screen-start { fill: #DCFCE7; stroke: #166534; stroke-width: 1.8; }
    .screen-auth { fill: #FEF3C7; stroke: #B45309; stroke-width: 1.5; }
    .screen-end { fill: #FFE4E6; stroke: #BE123C; stroke-width: 1.5; }
    .edge { stroke: #1F3864; stroke-width: 1.4; fill: none; }
    .edge-back { stroke: #94A3B8; stroke-width: 1.2; fill: none; stroke-dasharray: 5,4; }
    .legend-box { fill: #FFFFFF; stroke: #CBD5E1; }
    .legend-text { font-size: 11px; fill: #1F2937; }
  </style>
  <defs>
    <marker id="navArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1F3864"/>
    </marker>
    <marker id="navArrowBack" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#94A3B8"/>
    </marker>
  </defs>

  <text x="600" y="30" class="title" text-anchor="middle">Figure 5.5 – Navigation Flow Prototype</text>

  <!-- Welcome -->
  <g transform="translate(530,70)">
    <rect width="170" height="60" class="screen screen-start"/>
    <text x="85" y="26" class="screen-label" text-anchor="middle">Welcome</text>
    <text x="85" y="46" class="route" text-anchor="middle">/welcome  (start)</text>
  </g>

  <!-- Sign In / Create Account -->
  <g transform="translate(330,180)">
    <rect width="170" height="60" class="screen screen-auth"/>
    <text x="85" y="26" class="screen-label" text-anchor="middle">Sign In</text>
    <text x="85" y="46" class="route" text-anchor="middle">/sign-in</text>
  </g>
  <g transform="translate(730,180)">
    <rect width="190" height="60" class="screen screen-auth"/>
    <text x="95" y="26" class="screen-label" text-anchor="middle">Create Account</text>
    <text x="95" y="46" class="route" text-anchor="middle">/create-account</text>
  </g>

  <!-- Home (hub) -->
  <g transform="translate(525,300)">
    <rect width="180" height="64" class="screen"/>
    <text x="90" y="28" class="screen-label" text-anchor="middle">Home (Catalog)</text>
    <text x="90" y="48" class="route" text-anchor="middle">/home</text>
  </g>

  <!-- Bottom nav cluster (5 screens) -->
  <g transform="translate(60,440)">
    <rect width="160" height="60" class="screen"/>
    <text x="80" y="26" class="screen-label" text-anchor="middle">Search</text>
    <text x="80" y="46" class="route" text-anchor="middle">/search  (Cubit)</text>
  </g>
  <g transform="translate(260,440)">
    <rect width="160" height="60" class="screen"/>
    <text x="80" y="26" class="screen-label" text-anchor="middle">Favorites</text>
    <text x="80" y="46" class="route" text-anchor="middle">/favorite</text>
  </g>
  <g transform="translate(520,440)">
    <rect width="180" height="60" class="screen"/>
    <text x="90" y="26" class="screen-label" text-anchor="middle">Cart</text>
    <text x="90" y="46" class="route" text-anchor="middle">/cart</text>
  </g>
  <g transform="translate(740,440)">
    <rect width="160" height="60" class="screen"/>
    <text x="80" y="26" class="screen-label" text-anchor="middle">Profile</text>
    <text x="80" y="46" class="route" text-anchor="middle">/profile</text>
  </g>
  <g transform="translate(940,440)">
    <rect width="190" height="60" class="screen"/>
    <text x="95" y="26" class="screen-label" text-anchor="middle">Product Details</text>
    <text x="95" y="46" class="route" text-anchor="middle">(MaterialPageRoute)</text>
  </g>

  <!-- Checkout -->
  <g transform="translate(520,560)">
    <rect width="180" height="60" class="screen"/>
    <text x="90" y="26" class="screen-label" text-anchor="middle">Checkout</text>
    <text x="90" y="46" class="route" text-anchor="middle">/checkout</text>
  </g>

  <!-- Confirmation -->
  <g transform="translate(520,670)">
    <rect width="180" height="60" class="screen screen-end"/>
    <text x="90" y="26" class="screen-label" text-anchor="middle">Order Confirmation</text>
    <text x="90" y="46" class="route" text-anchor="middle">/confirmation</text>
  </g>

  <!-- Help & Support -->
  <g transform="translate(940,560)">
    <rect width="190" height="60" class="screen"/>
    <text x="95" y="26" class="screen-label" text-anchor="middle">Help &amp; Support</text>
    <text x="95" y="46" class="route" text-anchor="middle">/help-support</text>
  </g>

  <!-- Edges from Welcome -->
  <path d="M 565,130 C 460,150 430,165 425,180" class="edge" marker-end="url(#navArrow)"/>
  <text x="380" y="155" class="edge-label">"I already have an account"</text>
  <path d="M 665,130 C 790,150 815,165 825,180" class="edge" marker-end="url(#navArrow)"/>
  <text x="780" y="155" class="edge-label">"Let's get started"</text>

  <!-- Auth → Home -->
  <path d="M 415,240 C 430,270 480,300 535,310" class="edge" marker-end="url(#navArrow)"/>
  <text x="425" y="272" class="edge-label">on success</text>
  <path d="M 825,240 C 810,270 760,300 705,310" class="edge" marker-end="url(#navArrow)"/>
  <text x="745" y="272" class="edge-label">on success</text>

  <!-- Sign In ↔ Create Account -->
  <path d="M 500,210 L 730,210" class="edge-back" marker-end="url(#navArrowBack)"/>
  <text x="560" y="204" class="edge-label">"Don't have an account / I have an account"</text>

  <!-- Home → bottom nav screens -->
  <path d="M 540,360 C 320,400 260,425 175,440" class="edge" marker-end="url(#navArrow)"/>
  <path d="M 555,360 C 460,400 410,425 340,440" class="edge" marker-end="url(#navArrow)"/>
  <path d="M 605,365 C 605,395 605,420 605,440" class="edge" marker-end="url(#navArrow)"/>
  <path d="M 685,360 C 760,400 790,425 820,440" class="edge" marker-end="url(#navArrow)"/>
  <path d="M 700,360 C 870,400 950,425 1015,440" class="edge" marker-end="url(#navArrow)"/>

  <!-- bottom nav reverse (dashed) — going back to Home -->
  <path d="M 175,440 C 280,400 380,375 545,358" class="edge-back" marker-end="url(#navArrowBack)"/>
  <path d="M 340,440 C 400,400 450,375 555,358" class="edge-back" marker-end="url(#navArrowBack)"/>
  <path d="M 820,440 C 760,400 700,375 660,358" class="edge-back" marker-end="url(#navArrowBack)"/>

  <!-- Cart → Checkout -->
  <path d="M 610,500 C 610,530 610,545 610,560" class="edge" marker-end="url(#navArrow)"/>
  <text x="613" y="540" class="edge-label">"Checkout"</text>

  <!-- Checkout → Confirmation -->
  <path d="M 610,620 C 610,640 610,655 610,670" class="edge" marker-end="url(#navArrow)"/>
  <text x="613" y="650" class="edge-label">"Place Order"</text>

  <!-- Confirmation → Home (clear stack) -->
  <path d="M 700,700 C 1080,690 1180,500 720,335" class="edge" marker-end="url(#navArrow)"/>
  <text x="900" y="490" class="edge-label">"Continue Shopping"</text>

  <!-- Profile → Help & Support -->
  <path d="M 900,470 C 970,490 1000,520 1035,560" class="edge" marker-end="url(#navArrow)"/>
  <text x="950" y="510" class="edge-label">"Help &amp; Support"</text>

  <!-- Profile → Sign In on logout -->
  <path d="M 820,440 C 760,360 600,250 500,220" class="edge" marker-end="url(#navArrow)"/>
  <text x="650" y="350" class="edge-label">on Logout</text>

  <!-- Favorites / Search → Product Details -->
  <path d="M 420,470 C 700,485 950,485 1035,500" class="edge" marker-end="url(#navArrow)"/>
  <text x="700" y="478" class="edge-label">tap product</text>

  <!-- Product Details → Cart (add) -->
  <path d="M 1015,500 C 900,520 800,540 700,580" class="edge" marker-end="url(#navArrow)"/>
  <text x="850" y="540" class="edge-label">"Add to Cart"</text>

  <!-- Legend -->
  <g transform="translate(60,650)">
    <rect width="420" height="140" rx="8" class="legend-box"/>
    <text x="210" y="24" class="screen-label" text-anchor="middle">Legend</text>
    <rect x="20" y="40" width="22" height="14" class="screen screen-start"/>
    <text x="55" y="52" class="legend-text">Entry screen</text>
    <rect x="20" y="64" width="22" height="14" class="screen screen-auth"/>
    <text x="55" y="76" class="legend-text">Authentication screen</text>
    <rect x="20" y="88" width="22" height="14" class="screen"/>
    <text x="55" y="100" class="legend-text">Main / hub screen</text>
    <rect x="20" y="112" width="22" height="14" class="screen screen-end"/>
    <text x="55" y="124" class="legend-text">Terminal success screen</text>

    <line x1="230" y1="48" x2="280" y2="48" class="edge" marker-end="url(#navArrow)"/>
    <text x="290" y="52" class="legend-text">forward navigation</text>
    <line x1="230" y1="72" x2="280" y2="72" class="edge-back" marker-end="url(#navArrowBack)"/>
    <text x="290" y="76" class="legend-text">back / alternate path</text>
    <text x="230" y="100" class="legend-text" style="font-style:italic">/route   = named route</text>
    <text x="230" y="120" class="legend-text" style="font-style:italic">declared in AppRoutes</text>
  </g>
</svg>
