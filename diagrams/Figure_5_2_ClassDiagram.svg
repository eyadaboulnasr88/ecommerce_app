<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" font-family="Arial, sans-serif">
  <style>
    .title { font-size: 18px; font-weight: bold; fill: #1F3864; }
    .cls-name { font-size: 13px; font-weight: 700; fill: #ffffff; }
    .stereotype { font-size: 10px; font-style: italic; fill: #ffffff; }
    .member { font-size: 11px; fill: #1F2937; font-family: 'Consolas','Courier New',monospace; }
    .rel-label { font-size: 11px; fill: #1F3864; font-style: italic; }
    .header { fill: #1F3864; }
    .body { fill: #FFFFFF; stroke: #1F3864; stroke-width: 1.4; }
    .assoc { stroke: #444; stroke-width: 1.2; fill: none; }
    .dep { stroke: #444; stroke-width: 1.1; stroke-dasharray: 5,4; fill: none; }
    .inherit { stroke: #444; stroke-width: 1.4; fill: none; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
    <marker id="open" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="11" markerHeight="11" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10" fill="none" stroke="#444" stroke-width="1.2"/>
    </marker>
    <marker id="triangle" viewBox="0 0 12 12" refX="12" refY="6" markerWidth="14" markerHeight="14" orient="auto-start-reverse">
      <path d="M0,0 L12,6 L0,12 z" fill="#FFF" stroke="#444" stroke-width="1.2"/>
    </marker>
  </defs>

  <text x="600" y="30" class="title" text-anchor="middle">Figure 5.2 – High-Level Class Diagram</text>

  <!-- ProductModel -->
  <g transform="translate(40,80)">
    <rect width="230" height="180" rx="6" class="body"/>
    <rect width="230" height="34" rx="6" class="header"/>
    <text x="115" y="22" class="cls-name" text-anchor="middle">ProductModel</text>
    <line x1="0" y1="60" x2="230" y2="60" stroke="#1F3864"/>
    <text x="10" y="55" class="member">- id : String</text>
    <text x="10" y="72" class="member">- title : String</text>
    <text x="10" y="88" class="member">- description : String</text>
    <text x="10" y="104" class="member">- image : String</text>
    <text x="10" y="120" class="member">- price : double</text>
    <text x="10" y="136" class="member">- category : String</text>
    <line x1="0" y1="148" x2="230" y2="148" stroke="#1F3864"/>
    <text x="10" y="164" class="member">+ fromJson(json, id)</text>
    <text x="10" y="178" class="member">+ toMap() : Map</text>
  </g>

  <!-- CartService -->
  <g transform="translate(310,80)">
    <rect width="260" height="220" rx="6" class="body"/>
    <rect width="260" height="34" rx="6" class="header"/>
    <text x="130" y="16" class="stereotype" text-anchor="middle">«service»</text>
    <text x="130" y="29" class="cls-name" text-anchor="middle">CartService</text>
    <line x1="0" y1="60" x2="260" y2="60" stroke="#1F3864"/>
    <text x="10" y="56" class="member">- _firestore : FirebaseFirestore</text>
    <text x="10" y="72" class="member">- _auth : FirebaseAuth</text>
    <line x1="0" y1="84" x2="260" y2="84" stroke="#1F3864"/>
    <text x="10" y="100" class="member">+ addToCart(...)</text>
    <text x="10" y="116" class="member">+ removeFromCart(cartId)</text>
    <text x="10" y="132" class="member">+ updateQuantity(cartId, qty)</text>
    <text x="10" y="148" class="member">+ getCartItems() : Stream</text>
    <text x="10" y="164" class="member">+ getCartTotal() : double</text>
    <text x="10" y="180" class="member">+ getCartItemCount() : int</text>
    <text x="10" y="196" class="member">+ clearCart()</text>
  </g>

  <!-- AuthService -->
  <g transform="translate(610,80)">
    <rect width="230" height="120" rx="6" class="body"/>
    <rect width="230" height="34" rx="6" class="header"/>
    <text x="115" y="16" class="stereotype" text-anchor="middle">«service»</text>
    <text x="115" y="29" class="cls-name" text-anchor="middle">AuthService</text>
    <line x1="0" y1="60" x2="230" y2="60" stroke="#1F3864"/>
    <text x="10" y="56" class="member">(static utility class)</text>
    <line x1="0" y1="74" x2="230" y2="74" stroke="#1F3864"/>
    <text x="10" y="92" class="member">+ signInWithGoogle()</text>
    <text x="10" y="108" class="member">     : Future&lt;UserCredential&gt;</text>
  </g>

  <!-- AppRoutes -->
  <g transform="translate(880,80)">
    <rect width="280" height="220" rx="6" class="body"/>
    <rect width="280" height="34" rx="6" class="header"/>
    <text x="140" y="16" class="stereotype" text-anchor="middle">«routing»</text>
    <text x="140" y="29" class="cls-name" text-anchor="middle">AppRoutes</text>
    <line x1="0" y1="60" x2="280" y2="60" stroke="#1F3864"/>
    <text x="10" y="56" class="member">+ welcome / home / profile</text>
    <text x="10" y="72" class="member">+ signIn / createAccount</text>
    <text x="10" y="88" class="member">+ cart / favorite / search</text>
    <text x="10" y="104" class="member">+ checkout / confirmation</text>
    <text x="10" y="120" class="member">+ helpSupport</text>
    <line x1="0" y1="132" x2="280" y2="132" stroke="#1F3864"/>
    <text x="10" y="148" class="member">+ routes : Map&lt;String, Builder&gt;</text>
  </g>

  <!-- SearchCubit -->
  <g transform="translate(40,330)">
    <rect width="230" height="130" rx="6" class="body"/>
    <rect width="230" height="34" rx="6" class="header"/>
    <text x="115" y="16" class="stereotype" text-anchor="middle">«cubit»</text>
    <text x="115" y="29" class="cls-name" text-anchor="middle">SearchCubit</text>
    <line x1="0" y1="60" x2="230" y2="60" stroke="#1F3864"/>
    <text x="10" y="56" class="member">- _firestore : FirebaseFirestore</text>
    <line x1="0" y1="74" x2="230" y2="74" stroke="#1F3864"/>
    <text x="10" y="92" class="member">+ searchProducts(query)</text>
    <text x="10" y="108" class="member">     : Future&lt;void&gt;</text>
    <text x="10" y="124" class="member">+ emit(SearchState)</text>
  </g>

  <!-- SearchState (abstract) -->
  <g transform="translate(310,330)">
    <rect width="200" height="60" rx="6" class="body"/>
    <rect width="200" height="34" rx="6" class="header"/>
    <text x="100" y="16" class="stereotype" text-anchor="middle">«abstract»</text>
    <text x="100" y="29" class="cls-name" text-anchor="middle">SearchState</text>
  </g>

  <!-- SearchInitial / Loading / Loaded / Error -->
  <g transform="translate(310,420)">
    <rect width="200" height="36" rx="6" class="body"/>
    <rect width="200" height="36" rx="6" class="header"/>
    <text x="100" y="22" class="cls-name" text-anchor="middle">SearchInitial</text>
  </g>
  <g transform="translate(310,470)">
    <rect width="200" height="36" rx="6" class="body"/>
    <rect width="200" height="36" rx="6" class="header"/>
    <text x="100" y="22" class="cls-name" text-anchor="middle">SearchLoading</text>
  </g>
  <g transform="translate(310,520)">
    <rect width="200" height="56" rx="6" class="body"/>
    <rect width="200" height="34" rx="6" class="header"/>
    <text x="100" y="22" class="cls-name" text-anchor="middle">SearchLoaded</text>
    <text x="10" y="52" class="member">+ results : List&lt;ProductModel&gt;</text>
  </g>
  <g transform="translate(310,590)">
    <rect width="200" height="56" rx="6" class="body"/>
    <rect width="200" height="34" rx="6" class="header"/>
    <text x="100" y="22" class="cls-name" text-anchor="middle">SearchError</text>
    <text x="10" y="52" class="member">+ message : String</text>
  </g>

  <!-- Screens cluster -->
  <g transform="translate(560,330)">
    <rect width="600" height="316" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-dasharray="4,3"/>
    <text x="300" y="22" class="title" text-anchor="middle" font-size="13">«presentation» Screens</text>

    <g transform="translate(20,40)">
      <rect width="170" height="36" rx="6" class="body"/>
      <rect width="170" height="36" rx="6" class="header"/>
      <text x="85" y="22" class="cls-name" text-anchor="middle">WelcomeScreen</text>
    </g>
    <g transform="translate(210,40)">
      <rect width="170" height="36" rx="6" class="body"/>
      <rect width="170" height="36" rx="6" class="header"/>
      <text x="85" y="22" class="cls-name" text-anchor="middle">SignInScreen</text>
    </g>
    <g transform="translate(400,40)">
      <rect width="180" height="36" rx="6" class="body"/>
      <rect width="180" height="36" rx="6" class="header"/>
      <text x="90" y="22" class="cls-name" text-anchor="middle">CreateAccountScreen</text>
    </g>

    <g transform="translate(20,90)">
      <rect width="170" height="36" rx="6" class="body"/>
      <rect width="170" height="36" rx="6" class="header"/>
      <text x="85" y="22" class="cls-name" text-anchor="middle">HomeScreen</text>
    </g>
    <g transform="translate(210,90)">
      <rect width="170" height="36" rx="6" class="body"/>
      <rect width="170" height="36" rx="6" class="header"/>
      <text x="85" y="22" class="cls-name" text-anchor="middle">SearchView</text>
    </g>
    <g transform="translate(400,90)">
      <rect width="180" height="36" rx="6" class="body"/>
      <rect width="180" height="36" rx="6" class="header"/>
      <text x="90" y="22" class="cls-name" text-anchor="middle">ProductDetailsScreen</text>
    </g>

    <g transform="translate(20,140)">
      <rect width="170" height="36" rx="6" class="body"/>
      <rect width="170" height="36" rx="6" class="header"/>
      <text x="85" y="22" class="cls-name" text-anchor="middle">FavoriteScreen</text>
    </g>
    <g transform="translate(210,140)">
      <rect width="170" height="36" rx="6" class="body"/>
      <rect width="170" height="36" rx="6" class="header"/>
      <text x="85" y="22" class="cls-name" text-anchor="middle">CartScreen</text>
    </g>
    <g transform="translate(400,140)">
      <rect width="180" height="36" rx="6" class="body"/>
      <rect width="180" height="36" rx="6" class="header"/>
      <text x="90" y="22" class="cls-name" text-anchor="middle">CheckoutScreen</text>
    </g>

    <g transform="translate(20,190)">
      <rect width="170" height="36" rx="6" class="body"/>
      <rect width="170" height="36" rx="6" class="header"/>
      <text x="85" y="22" class="cls-name" text-anchor="middle">ConfirmationScreen</text>
    </g>
    <g transform="translate(210,190)">
      <rect width="170" height="36" rx="6" class="body"/>
      <rect width="170" height="36" rx="6" class="header"/>
      <text x="85" y="22" class="cls-name" text-anchor="middle">ProfileScreen</text>
    </g>
    <g transform="translate(400,190)">
      <rect width="180" height="36" rx="6" class="body"/>
      <rect width="180" height="36" rx="6" class="header"/>
      <text x="90" y="22" class="cls-name" text-anchor="middle">HelpSupportView</text>
    </g>

    <g transform="translate(140,250)">
      <rect width="320" height="50" rx="6" class="body"/>
      <rect width="320" height="34" rx="6" class="header"/>
      <text x="160" y="22" class="cls-name" text-anchor="middle">AppBottomNavBar (shared widget)</text>
    </g>
  </g>

  <!-- Relationships -->
  <!-- Screens use CartService -->
  <path d="M 570,140 C 540,140 540,250 615,250" class="dep" marker-end="url(#open)"/>
  <text x="528" y="200" class="rel-label">«uses»</text>

  <!-- Search screens use SearchCubit -->
  <path d="M 295,395 C 270,395 270,420 295,420" class="assoc" marker-end="url(#open)"/>
  <path d="M 270,360 C 540,360 540,420 770,420" class="dep" marker-end="url(#open)"/>
  <text x="600" y="395" class="rel-label">«uses» SearchCubit</text>

  <!-- SearchCubit emits SearchState -->
  <line x1="270" y1="395" x2="305" y2="360" class="assoc" marker-end="url(#open)"/>
  <text x="270" y="350" class="rel-label">emits</text>

  <!-- Inheritance from SearchState -->
  <line x1="410" y1="420" x2="410" y2="394" class="inherit" marker-end="url(#triangle)"/>
  <line x1="410" y1="470" x2="410" y2="394" class="inherit" marker-end="url(#triangle)"/>
  <line x1="410" y1="520" x2="410" y2="394" class="inherit" marker-end="url(#triangle)"/>
  <line x1="410" y1="590" x2="410" y2="394" class="inherit" marker-end="url(#triangle)"/>

  <!-- SearchLoaded holds ProductModel list -->
  <path d="M 310,548 C 200,548 200,180 155,260" class="assoc" marker-end="url(#open)"/>
  <text x="180" y="450" class="rel-label">List&lt;ProductModel&gt;</text>

  <!-- Auth screens use AuthService -->
  <path d="M 610,140 C 590,140 590,76 575,76" class="dep" marker-end="url(#open)"/>
  <text x="556" y="115" class="rel-label">«uses»</text>

  <!-- Screens use AppRoutes for navigation -->
  <path d="M 1160,300 C 1180,300 1180,400 1160,400" class="dep" marker-end="url(#open)"/>
  <text x="1080" y="320" class="rel-label">navigates via AppRoutes</text>

  <text x="600" y="740" class="rel-label" text-anchor="middle">Solid arrows = associations, dashed arrows = «uses» dependencies, hollow triangle = inheritance.</text>
  <text x="600" y="760" class="rel-label" text-anchor="middle">Persistent state is stored in Firebase Cloud Firestore (collections: users, products, carts, favorites, orders).</text>
</svg>
