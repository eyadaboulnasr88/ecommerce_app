<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" font-family="Arial, sans-serif">
  <style>
    .title { font-size: 18px; font-weight: bold; fill: #1F3864; }
    .node-label { font-size: 14px; font-weight: 700; fill: #1F3864; }
    .stereotype { font-size: 11px; font-style: italic; fill: #475569; }
    .small { font-size: 11px; fill: #1F2937; }
    .arrow-label { font-size: 11px; fill: #1F3864; font-style: italic; }
    .device { fill: #F1F5F9; stroke: #1F3864; stroke-width: 1.6; }
    .component { fill: #FFFFFF; stroke: #1F3864; stroke-width: 1.3; }
    .link { stroke: #1F3864; stroke-width: 1.6; fill: none; }
  </style>
  <defs>
    <marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8">
      <circle cx="5" cy="5" r="3" fill="#1F3864"/>
    </marker>
  </defs>

  <text x="550" y="32" class="title" text-anchor="middle">Figure 5.4 – Three-Tier Deployment Architecture</text>

  <!-- Tier 1: Client device -->
  <g transform="translate(40,80)">
    <path d="M 0,30 L 30,0 L 320,0 L 320,260 L 290,290 L 0,290 Z" class="device"/>
    <path d="M 30,0 L 30,260 L 0,290" class="device" fill="none"/>
    <text x="160" y="22" class="stereotype" text-anchor="middle">«device»</text>
    <text x="160" y="42" class="node-label" text-anchor="middle">Customer Mobile Device</text>
    <text x="160" y="60" class="small" text-anchor="middle">(Android 8+ / iOS 13+)</text>

    <g transform="translate(40,90)">
      <rect width="240" height="60" rx="4" class="component"/>
      <text x="120" y="22" class="stereotype" text-anchor="middle">«executable»</text>
      <text x="120" y="42" class="node-label" text-anchor="middle">Ecommerce Flutter App</text>
      <text x="120" y="56" class="small" text-anchor="middle">Dart 3.x • Material 3 • Poppins</text>
    </g>

    <g transform="translate(40,170)">
      <rect width="240" height="80" rx="4" class="component"/>
      <text x="120" y="22" class="stereotype" text-anchor="middle">«library»</text>
      <text x="120" y="42" class="node-label" text-anchor="middle">Firebase Client SDK</text>
      <text x="120" y="58" class="small" text-anchor="middle">firebase_auth, cloud_firestore,</text>
      <text x="120" y="74" class="small" text-anchor="middle">google_sign_in</text>
    </g>
  </g>

  <!-- Tier 2: Firebase BaaS -->
  <g transform="translate(420,80)">
    <path d="M 0,30 L 30,0 L 380,0 L 380,360 L 350,390 L 0,390 Z" class="device"/>
    <path d="M 30,0 L 30,360 L 0,390" class="device" fill="none"/>
    <text x="195" y="22" class="stereotype" text-anchor="middle">«BaaS execution environment»</text>
    <text x="195" y="42" class="node-label" text-anchor="middle">Google Firebase Platform</text>
    <text x="195" y="60" class="small" text-anchor="middle">Region: nam5 (multi-region)</text>

    <g transform="translate(50,90)">
      <rect width="290" height="80" rx="4" class="component"/>
      <text x="145" y="22" class="stereotype" text-anchor="middle">«service»</text>
      <text x="145" y="42" class="node-label" text-anchor="middle">Firebase Authentication</text>
      <text x="145" y="58" class="small" text-anchor="middle">Email/Password • Google OAuth</text>
      <text x="145" y="74" class="small" text-anchor="middle">Issues short-lived ID tokens</text>
    </g>

    <g transform="translate(50,190)">
      <rect width="290" height="170" rx="4" class="component"/>
      <text x="145" y="22" class="stereotype" text-anchor="middle">«database»</text>
      <text x="145" y="42" class="node-label" text-anchor="middle">Cloud Firestore</text>
      <text x="145" y="58" class="small" text-anchor="middle">NoSQL document store, real-time</text>
      <text x="60" y="82" class="small">Collections:</text>
      <text x="60" y="100" class="small">• users      (profile docs)</text>
      <text x="60" y="118" class="small">• products   (catalog docs)</text>
      <text x="60" y="136" class="small">• carts      (per-user line items)</text>
      <text x="60" y="154" class="small">• favorites  (per-user favorites)</text>
      <text x="60" y="167" class="small">• orders     (placed orders)</text>
    </g>
  </g>

  <!-- Tier 3: Image CDN -->
  <g transform="translate(870,80)">
    <path d="M 0,30 L 30,0 L 210,0 L 210,170 L 180,200 L 0,200 Z" class="device"/>
    <path d="M 30,0 L 30,170 L 0,200" class="device" fill="none"/>
    <text x="110" y="22" class="stereotype" text-anchor="middle">«CDN»</text>
    <text x="110" y="42" class="node-label" text-anchor="middle">Public Image CDN</text>
    <text x="110" y="60" class="small" text-anchor="middle">(Unsplash during MVP)</text>

    <g transform="translate(20,80)">
      <rect width="170" height="100" rx="4" class="component"/>
      <text x="85" y="22" class="stereotype" text-anchor="middle">«content»</text>
      <text x="85" y="42" class="node-label" text-anchor="middle">Product Images</text>
      <text x="85" y="62" class="small" text-anchor="middle">.jpg / .webp assets</text>
      <text x="85" y="80" class="small" text-anchor="middle">Cached by Flutter</text>
      <text x="85" y="94" class="small" text-anchor="middle">Image.network widget</text>
    </g>
  </g>

  <!-- Communication links -->
  <line x1="360" y1="220" x2="420" y2="220" class="link"/>
  <text x="368" y="210" class="arrow-label">HTTPS / TLS 1.2+</text>
  <text x="368" y="240" class="arrow-label">Firebase REST / gRPC</text>

  <line x1="800" y1="220" x2="870" y2="220" class="link"/>
  <text x="800" y="210" class="arrow-label">HTTPS</text>
  <text x="800" y="240" class="arrow-label">GET image</text>

  <!-- Bottom note -->
  <g transform="translate(40,490)">
    <rect width="1020" height="180" rx="8" fill="#F8FAFC" stroke="#CBD5E1"/>
    <text x="510" y="28" class="node-label" text-anchor="middle">Deployment Notes</text>
    <text x="20" y="58" class="small">• Client tier: a single Flutter binary is compiled twice (APK / AAB for Android, IPA for iOS) from one codebase.</text>
    <text x="20" y="78" class="small">• BaaS tier: managed by Google; no server administration. Spark (free) tier supports the MVP load.</text>
    <text x="20" y="98" class="small">• CDN tier: product images are served from a public HTTPS endpoint and cached on-device by Flutter's Image.network.</text>
    <text x="20" y="118" class="small">• All traffic between tiers uses HTTPS with TLS 1.2 or higher. Firebase ID tokens authenticate every Firestore call.</text>
    <text x="20" y="138" class="small">• Firestore security rules restrict reads and writes on carts, favorites, and orders to the document owner (userId == auth.uid).</text>
    <text x="20" y="158" class="small">• A future deployment may replace the public image CDN with Firebase Storage and add Firebase Cloud Messaging for push notifications.</text>
  </g>
</svg>
